name: AWS PQC deployment gates
# Actions 화면에서 수동 실행한다. push/PR마다 유료 EC2 실험을 시작하지 않는다.
on:
  workflow_dispatch:
    inputs:
      balanced_latency:
        description: Run ten balanced cold/warm latency blocks after deployment gates
        type: boolean
        default: false
      systems_experiments:
        description: Run MTU, network delay, HRR, concurrent load and rollout experiments
        type: boolean
        default: false
      rollout_only:
        description: Retry only the deployment-under-load trial (requires systems_experiments)
        type: boolean
        default: false
permissions:
  contents: read
# 같은 EC2 두 대를 사용하는 배포 실행을 직렬화해 서로 충돌하지 않게 한다.
concurrency:
  group: kpqc-aws-lab
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == '17seetwice/kpqc-tls-devops-lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      # GitHub OIDC 토큰으로 AWS 전용 역할의 단기 인증을 받는다. 영구 AWS 키를 사용하지 않는다.
      id-token: write
    env:
      KPQC_ROLLOUT_ONLY: ${{ inputs.rollout_only && '1' || '0' }}
      KPQC_SYSTEMS: ${{ inputs.systems_experiments && '1' || '0' }}
      KPQC_BALANCED_LATENCY: ${{ inputs.balanced_latency && '1' || '0' }}
      KPQC_SERVER_INSTANCE_ID: ${{ secrets.KPQC_SERVER_INSTANCE_ID }}
      KPQC_CLIENT_INSTANCE_ID: ${{ secrets.KPQC_CLIENT_INSTANCE_ID }}
      KPQC_SERVER_SG_ID: ${{ secrets.KPQC_SERVER_SG_ID }}
      KPQC_CLIENT_SG_ID: ${{ secrets.KPQC_CLIENT_SG_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify fail-closed cryptographic policy
        run: python3 scripts/test_gate_policy.py
      - name: Verify EC2 cleanup failure paths
        run: python3 scripts/test_ci_deploy.py
      # 여기서 locally는 내 PC가 아니라 GitHub runner 안의 Docker 시험을 의미한다.
      - name: Build candidate and verify locally
        run: |
          mkdir -p artifacts
          docker build -f Dockerfile.gate -t kpqc-lab:gate .
          docker run --rm --network none --cpus 2 --memory 512m --tmpfs /state:size=64m -v "$PWD/artifacts:/results-root" --entrypoint python3 kpqc-lab:gate /app/scripts/gate_suite.py --local
      - name: Verify balanced latency collector locally
        if: inputs.balanced_latency
        run: docker run --rm --network none --cpus 2 --memory 512m --tmpfs /state:size=64m -v "$PWD/artifacts:/results-root" --entrypoint python3 kpqc-lab:gate /app/scripts/extended_handshake.py --local --balanced --smoke
      - name: Verify isolated network and concurrent collector locally
        if: inputs.systems_experiments
        run: |
          test "$KPQC_BALANCED_LATENCY" = "0"
          sudo modprobe sch_netem
          python3 scripts/systems_experiments.py --local --smoke --image kpqc-lab:gate
      - name: Obtain short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.KPQC_AWS_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: kpqc-${{ github.run_id }}
      # Secret과 검증된 서버 호스트 키를 준비한다. 키 내용을 로그에 출력하지 않는다.
      - name: Install SSH credentials and pinned host keys
        env:
          SSH_KEY: ${{ secrets.KPQC_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KPQC_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p .aws-runtime
          printf '%s\n' "$SSH_KEY" > kpqc-devops-lab.pem
          printf '%s\n' "$KNOWN_HOSTS" > .aws-runtime/known_hosts
      # ci_deploy가 EC2와 이미지 전달을 관리하고 gate_suite가 실제 TLS 후보 판정·전환을 수행한다.
      - name: Deploy exact tested image and exercise approval and rejection
        run: |
          if [ "$KPQC_SYSTEMS" = "1" ]; then
            python3 scripts/ci_deploy.py --systems
          elif [ "$KPQC_BALANCED_LATENCY" = "1" ]; then
            python3 scripts/ci_deploy.py --extended
          else
            python3 scripts/ci_deploy.py
          fi
      # 앞 단계 실패에도 정리를 시도한다. 강제 종료나 AWS 장애 시 정리 결과를 따로 확인해야 한다.
      - name: Stop lab and revoke temporary runner ingress
        if: always()
        run: python3 scripts/ci_deploy.py --cleanup
      # 공개 artifact에는 개인키·원문 제어 설정 대신 허용한 결과 필드만 저장한다.
      - name: Prepare public experiment evidence
        if: always()
        run: |
          mkdir -p artifacts
          sudo chmod -R a+rX artifacts
          python3 scripts/ci_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-evidence-${{ github.run_id }}
          path: public-evidence/
          retention-days: 14
